; PlatformIO Project Configuration File
; Bullseye - Smart Digital Level & Real-Time Precision Angle Guide

[platformio]
default_envs = waveshare_esp32s3_touch_lcd_128

[env:waveshare_esp32s3_touch_lcd_128]
platform = espressif32
board = waveshare_esp32s3_touch_lcd_128
framework = arduino
board_build.partitions = default_16MB.csv

monitor_speed = 115200
upload_speed = 921600

build_unflags = 
    -DARDUINO_USB_CDC_ON_BOOT=1

build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -I include

lib_deps = 
    lovyan03/LovyanGFX@^1.2.36
    lahavg/QMI8658@^1.0.1
    Wire
    SPI
